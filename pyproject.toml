[project]
name = "local-autoresearch"
version = "0.2.0"
description = "A local research loop for CPU experiments, with Flint by default"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.18.1",
    "matplotlib==3.10.3",
    "scikit-learn==1.7.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.ruff]
line-length = 100
extend-exclude = ["examples"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
